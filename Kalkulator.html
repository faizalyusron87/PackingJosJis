<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator X50 X20</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    background:#f3f4f6;
    color:#111827;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

button,input{
    font-family:inherit;
}

.container{
    width:100%;
    max-width:520px;
    margin:auto;
    padding:16px;
}

/* HEADER */
.header{
    width:100%;
    background:#111827;
    color:white;
    border-radius:25px;
    padding:30px 15px;
    text-align:center;
    margin-bottom:16px;
    box-shadow:0 8px 25px rgba(0,0,0,.10);
}

.header h1{
    font-size:29px;
    font-weight:800;
}

.header p{
    margin-top:7px;
    font-size:16px;
    color:#c7cbd4;
}

/* MODE */
.mode-box{
    width:100%;
    background:white;
    border-radius:18px;
    padding:6px;
    display:flex;
    gap:6px;
    margin-bottom:16px;
    box-shadow:0 5px 18px rgba(0,0,0,.06);
}

.mode-btn{
    flex:1;
    height:48px;
    border:0;
    border-radius:13px;
    background:transparent;
    color:#6b7280;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.mode-btn.active{
    background:#111827;
    color:white;
}

/* KALKULATOR */
.card{
    width:100%;
    background:white;
    border-radius:25px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.label{
    display:block;
    color:#6b7280;
    font-size:17px;
    margin-bottom:9px;
}

.input{
    width:100%;
    height:62px;
    border:3px solid #182131;
    border-radius:18px;
    outline:none;
    padding:0 18px;
    font-size:26px;
    color:#111827;
    background:white;
}

.input:focus{
    border-color:#159447;
}

.input::placeholder{
    color:#9ca3af;
}

/* RUMUS */
.rumus{
    width:100%;
    margin-top:15px;
    background:#eefbf5;
    border:1px solid #d8f2e6;
    border-radius:17px;
    padding:16px;
    text-align:center;
}

.rumus-title{
    color:#168b49;
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.rumus-text{
    color:#4b5563;
    font-size:19px;
    word-break:break-word;
}

/* HASIL */
.hasil-box{
    width:100%;
    margin-top:15px;
    background:#111827;
    color:white;
    border-radius:22px;
    padding:25px 12px;
    text-align:center;
}

.hasil-label{
    color:#d1d5db;
    font-size:17px;
}

.hasil{
    margin-top:7px;
    font-size:48px;
    line-height:1.15;
    font-weight:800;
    word-break:break-word;
}

.hasil-kali{
    margin-top:8px;
    color:#22c55e;
    font-size:17px;
    font-weight:bold;
}

/* TOMBOL */
.button-row{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.btn{
    height:52px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.btn-simpan{
    flex:1;
    background:#159447;
    color:white;
}

.btn-reset{
    width:105px;
    background:#e5e7eb;
    color:#374151;
}

.btn:active,
.mode-btn:active{
    transform:scale(.97);
}

/* RIWAYAT */
.history-card{
    width:100%;
    background:white;
    border-radius:25px;
    padding:20px;
    box-shadow:0 6px 22px rgba(0,0,0,.07);
}

.history-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding-bottom:15px;
    border-bottom:1px solid #e5e7eb;
}

.history-title{
    font-size:21px;
    font-weight:bold;
}

.btn-delete{
    border:2px solid #fecaca;
    background:white;
    color:#dc2626;
    padding:9px 13px;
    border-radius:11px;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
}

.history-item{
    padding:15px 2px;
    border-bottom:1px solid #eeeeee;
}

.history-item:last-child{
    border-bottom:0;
}

.history-date{
    font-size:11px;
    color:#9ca3af;
    margin-bottom:5px;
}

.history-rumus{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.history-result{
    margin-top:5px;
    font-size:22px;
    font-weight:bold;
    color:#111827;
}

.empty{
    text-align:center;
    padding:35px 10px;
    color:#9ca3af;
}

.empty-icon{
    font-size:38px;
    margin-bottom:8px;
}

.empty-title{
    font-size:17px;
    font-weight:bold;
    color:#6b7280;
}

.empty-text{
    margin-top:5px;
    font-size:13px;
}

/* HP KECIL */
@media(max-width:380px){

    .container{
        padding:12px;
    }

    .header{
        padding:27px 10px;
    }

    .header h1{
        font-size:25px;
    }

    .header p{
        font-size:14px;
    }

    .card,
    .history-card{
        padding:17px;
    }

    .input{
        height:58px;
        font-size:24px;
    }

    .hasil{
        font-size:40px;
    }

}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->
    <div class="header">

        <h1>
            KALKULATOR <span id="judulMode">X50</span>
        </h1>

        <p>
            Penjumlahan otomatis ×<span id="subtitleMode">50</span>
        </p>

    </div>


    <!-- PILIH X50 / X20 -->
    <div class="mode-box">

        <button
            id="btnX50"
            class="mode-btn active"
            onclick="gantiMode(50)">
            X50
        </button>

        <button
            id="btnX20"
            class="mode-btn"
            onclick="gantiMode(20)">
            X20
        </button>

    </div>


    <!-- KALKULATOR -->
    <div class="card">

        <label class="label">
            Masukkan angka
        </label>

        <input
            type="number"
            id="angka"
            class="input"
            placeholder="Contoh: 50"
            inputmode="decimal"
            enterkeyhint="done"
        >


        <!-- RUMUS -->
        <div class="rumus">

            <div class="rumus-title">
                RUMUS
            </div>

            <div
                class="rumus-text"
                id="rumus">
                Belum ada angka
            </div>

        </div>


        <!-- HASIL -->
        <div class="hasil-box">

            <div class="hasil-label">
                HASIL <span id="hasilMode">X50</span>
            </div>

            <div
                class="hasil"
                id="hasil">
                0
            </div>

            <div class="hasil-kali">
                Total × <span id="hasilKali">50</span>
            </div>

        </div>


        <!-- BUTTON -->
        <div class="button-row">

            <button
                class="btn btn-simpan"
                onclick="simpanRiwayat()">
                SIMPAN
            </button>

            <button
                class="btn btn-reset"
                onclick="resetKalkulator()">
                RESET
            </button>

        </div>

    </div>


    <!-- RIWAYAT -->
    <div class="history-card">

        <div class="history-head">

            <div class="history-title">
                RIWAYAT <span id="historyMode">X50</span>
            </div>

            <button
                class="btn-delete"
                onclick="hapusRiwayat()">
                🗑 Hapus
            </button>

        </div>

        <div id="riwayat"></div>

    </div>

</div>


<script>

/* ==========================================
   VARIABEL
========================================== */

let mode = 50;
let angkaList = [];


/* ==========================================
   GANTI MODE
========================================== */

function gantiMode(nilai){

    mode = nilai;

    angkaList = [];

    document.getElementById("angka").value = "";

    document.getElementById("judulMode").innerText =
        "X" + mode;

    document.getElementById("subtitleMode").innerText =
        mode;

    document.getElementById("hasilMode").innerText =
        "X" + mode;

    document.getElementById("hasilKali").innerText =
        mode;

    document.getElementById("historyMode").innerText =
        "X" + mode;


    document.getElementById("btnX50")
        .classList.toggle(
            "active",
            mode === 50
        );

    document.getElementById("btnX20")
        .classList.toggle(
            "active",
            mode === 20
        );


    tampilkanHasil();

    tampilkanRiwayat();

    document.getElementById("angka").focus();

}


/* ==========================================
   ENTER = TAMBAH ANGKA
========================================== */

document
.getElementById("angka")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            event.preventDefault();

            tambahAngka();

        }

    }
);


/* ==========================================
   TAMBAH ANGKA
========================================== */

function tambahAngka(){

    const input =
        document.getElementById("angka");

    const nilai =
        input.value.trim();


    if(nilai === ""){
        return;
    }


    const angka =
        Number(nilai);


    if(!Number.isFinite(angka)){
        return;
    }


    angkaList.push(angka);

    input.value = "";

    tampilkanHasil();

    input.focus();

}


/* ==========================================
   TOTAL
========================================== */

function hitungTotal(){

    return angkaList.reduce(
        function(total, angka){

            return total + angka;

        },
        0
    );

}


/* ==========================================
   FORMAT ANGKA
========================================== */

function formatAngka(angka){

    return Number(angka).toLocaleString(
        "id-ID",
        {
            maximumFractionDigits:10
        }
    );

}


/* ==========================================
   TAMPILKAN HASIL
========================================== */

function tampilkanHasil(){

    const rumus =
        document.getElementById("rumus");

    const hasil =
        document.getElementById("hasil");


    if(angkaList.length === 0){

        rumus.innerText =
            "Belum ada angka";

        hasil.innerText =
            "0";

        return;

    }


    const total =
        hitungTotal();


    const hasilAkhir =
        total * mode;


    rumus.innerText =
        angkaList
        .map(formatAngka)
        .join(" + ")
        + " = "
        + formatAngka(total);


    hasil.innerText =
        formatAngka(hasilAkhir);

}


/* ==========================================
   SIMPAN RIWAYAT
========================================== */

function simpanRiwayat(){

    if(angkaList.length === 0){

        alert(
            "Masukkan angka terlebih dahulu."
        );

        return;

    }


    const total =
        hitungTotal();


    const hasilAkhir =
        total * mode;


    const key =
        "riwayatX" + mode;


    let riwayat =
        JSON.parse(
            localStorage.getItem(key)
        );


    if(!Array.isArray(riwayat)){

        riwayat = [];

    }


    const waktu =
        new Date().toLocaleString(
            "id-ID",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    riwayat.unshift({

        angka:
            angkaList
            .map(formatAngka)
            .join(" + "),

        total:
            total,

        hasil:
            hasilAkhir,

        waktu:
            waktu

    });


    localStorage.setItem(
        key,
        JSON.stringify(riwayat)
    );


    tampilkanRiwayat();

    resetKalkulator();

}


/* ==========================================
   TAMPILKAN RIWAYAT
========================================== */

function tampilkanRiwayat(){

    const tempat =
        document.getElementById("riwayat");


    const key =
        "riwayatX" + mode;


    let riwayat =
        JSON.parse(
            localStorage.getItem(key)
        );


    if(!Array.isArray(riwayat)){

        riwayat = [];

    }


    if(riwayat.length === 0){

        tempat.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📋
                </div>

                <div class="empty-title">
                    Belum ada riwayat
                </div>

                <div class="empty-text">
                    Hasil perhitungan akan muncul di sini
                </div>

            </div>

        `;

        return;

    }


    tempat.innerHTML = "";


    riwayat.forEach(
        function(data){

            const item =
                document.createElement("div");


            item.className =
                "history-item";


            /*
              CEGAH "undefined"
              PADA RIWAYAT LAMA
            */

            const angkaText =
                data.angka || "";


            const totalText =
                data.total !== undefined
                ? formatAngka(data.total)
                : "";


            const hasilText =
                data.hasil !== undefined
                ? formatAngka(data.hasil)
                : "";


            const waktuText =
                data.waktu || "";


            item.innerHTML = `

                ${
                    waktuText
                    ?
                    `<div class="history-date">
                        ${waktuText}
                    </div>`
                    :
                    ""
                }

                <div class="history-rumus">
                    ${angkaText}
                    ${
                        totalText
                        ?
                        " = " + totalText
                        :
                        ""
                    }
                </div>

                <div class="history-result">
                    ${hasilText}
                </div>

            `;


            tempat.appendChild(item);

        }
    );

}


/* ==========================================
   RESET
========================================== */

function resetKalkulator(){

    angkaList = [];

    document.getElementById("angka").value = "";

    tampilkanHasil();

}


/* ==========================================
   HAPUS RIWAYAT
   LANGSUNG TANPA KONFIRMASI
========================================== */

function hapusRiwayat(){

    const key =
        "riwayatX" + mode;


    /*
       HAPUS LANGSUNG
       TANPA ALERT
       TANPA CONFIRM
       TANPA DELAY
    */

    localStorage.removeItem(key);


    /*
       LANGSUNG UPDATE TAMPILAN
    */

    tampilkanRiwayat();

}


/* ==========================================
   START
========================================== */

tampilkanHasil();

tampilkanRiwayat();

</script>

</body>
</html>
